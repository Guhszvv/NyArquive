[package]
name = "nyarquive"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6.10", features = ["fs", "cors"] }
header = "0.0.0"
uuid = { version = "1.23.1", features = ["v4"] }
tokio-util = "0.7.18"
rusqlite = "0.39.0"
